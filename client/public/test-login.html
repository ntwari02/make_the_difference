<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #0f0f23;
            color: white;
            font-size: 14px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f0f23;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Login API Test</h1>
        <p>Test your login and see what role the API returns</p>
        
        <input type="text" id="email" placeholder="Email" value="">
        <input type="password" id="password" placeholder="Password" value="">
        <button onclick="testLogin()">Test Login</button>
        <button onclick="clearSession()" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">Clear Session & Storage</button>
        
        <div class="result" id="result">
            Results will appear here...
        </div>
    </div>

    <script>
        function clearSession() {
            const resultDiv = document.getElementById('result');
            
            // Clear all storage
            localStorage.clear();
            sessionStorage.clear();
            
            resultDiv.innerHTML = '<span class="success">🧹 ALL SESSION DATA CLEARED!</span>\n\n';
            resultDiv.innerHTML += '<span class="warning">✅ localStorage cleared</span>\n';
            resultDiv.innerHTML += '<span class="warning">✅ sessionStorage cleared</span>\n\n';
            resultDiv.innerHTML += '<span class="success">You can now login with fresh session data.</span>\n';
        }
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '⏳ Testing login...\n';
            
            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identifier: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ LOGIN SUCCESSFUL!</span>\n\n`;
                    resultDiv.innerHTML += `<span class="success">📋 API Response:</span>\n`;
                    resultDiv.innerHTML += JSON.stringify(data, null, 2) + '\n\n';
                    
                    if (data.user) {
                        resultDiv.innerHTML += `<span class="warning">👤 USER ROLE: ${data.user.role}</span>\n`;
                        resultDiv.innerHTML += `<span class="warning">📧 EMAIL: ${data.user.email}</span>\n`;
                        resultDiv.innerHTML += `<span class="warning">🆔 ID: ${data.user.id}</span>\n\n`;
                        
                        // Store tokens and user data in localStorage
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('refresh_token', data.refresh_token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        resultDiv.innerHTML += `<span class="success">💾 Tokens and user data saved to localStorage</span>\n\n`;
                        
                        // Determine redirect path
                        const roleMap = {
                            'buyer': '/buyer/dashboard',
                            'dealer': '/dealer/dashboard',
                            'admin': '/admin/dashboard',
                            'student': '/student/dashboard',
                            'instructor': '/instructor/dashboard'
                        };
                        
                        const redirectPath = roleMap[data.user.role] || '/';
                        resultDiv.innerHTML += `<span class="success">📍 Redirecting to: ${redirectPath}</span>\n`;
                        
                        // Redirect after a short delay
                        setTimeout(() => {
                            window.location.href = redirectPath;
                        }, 1500);
                    }
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ LOGIN FAILED</span>\n\n`;
                    resultDiv.innerHTML += JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ ERROR:</span>\n${error.message}`;
            }
        }
    </script>
</body>
</html>
